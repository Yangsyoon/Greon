name: greon
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.3 # 파일 경로 조작
  image: ^4.1.4 # 이미지 리사이징 및 처리 (모델 입력 전처리)



  provider: ^6.1.2



  cupertino_icons: ^1.0.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  shared_preferences:
  http:
  internet_connection_checker: ^1.0.0+1
  flutter_bloc:
  get_it:
  shimmer:
  cached_network_image: ^3.4.1
  flutter_svg:
  dots_indicator:
  flutter_secure_storage:
  photo_view:
  dotted_border: ^2.0.0+3
  flutter_local_notifications: ^17.0.0
  share_plus:
  get_storage:
  screenshot:
  path_provider:
  url_launcher: ^6.3.2
  flutter_phoenix:
  # Firebase Core: Firebase 앱을 초기화하고 다른 Firebase 플러그인을 사용하기 위한 필수 패키지
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  firebase_auth: ^5.5.2
  firebase_core_web: ^2.22.0
  firebase_messaging: ^15.2.6
  intl: ^0.18.1

  image_picker: ^1.0.4
  firebase_storage: ^12.4.5
  geolocator: ^14.0.0
  #light : ^4.1.0
  light_sensor: ^3.0.1
  table_calendar: ^3.0.9
  timezone: ^0.9.2
  android_intent_plus: ^4.0.0
  device_info_plus: ^9.0.0
  kpostal: ^1.0.7
  webview_flutter: ^4.2.1
  tflite_flutter: ^0.11.0
  arcore_flutter_plugin: ^0.1.0
  vector_math: ^2.1.4
  permission_handler: ^11.3.1
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/greon.png"

dependency_overrides:
  geolocator: ^14.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/svg/
    - assets/images/
    - assets/model.tflite
    - assets/model_float32.tflite
